<!DOCTYPE html>
<html>
<head>
  <title>Show Player</title>
  <style>
    html, body { margin: 0; background: black; overflow: hidden; width: 100%; height: 100%; }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <video id="videoA" playsinline></video>
  <video id="videoB" playsinline></video>
  <audio id="ambientAudioEl" loop></audio>
  <canvas id="compositeCanvas"></canvas>
  <script src="show-data.js"></script>
  <script src="webplayer.bundle.js"></script>
</body>
</html>
